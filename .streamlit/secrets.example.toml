# Copy to .streamlit/secrets.toml (git-ignored) for local use, or paste into
# Streamlit Community Cloud > App settings > Secrets. Placeholder values only:
# never commit real ones. Leave [auth] and [connections.sql] out to run FORAGE
# as a single local user with SQLite (demo mode).

# Google accounts allowed to use the personal pages. Anyone else who signs in
# sees "Access not enabled for this account". An empty list lets nobody in.
ALLOWED_EMAILS = ["you@gmail.com", "teammate@gmail.com"]

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"   # online: "https://<your-app>.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-long-random-string"      # python -c "import secrets; print(secrets.token_hex(32))"

[auth.google]
client_id = "xxxxxxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxxxxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[connections.sql]
# Neon: Dashboard > Connect > pooled connection string. postgresql:// is accepted too.
url = "postgresql+psycopg://USER:PASSWORD@HOST/DBNAME?sslmode=require"
