# FORAGE "Fresh Shelf" theme: linen surfaces, herb-green brand, Fraunces for titles and DM Sans for text.
# Everything Streamlit's theme cannot express (label cards, shelves, gauge) lives in ui/theme.py.
# Keep chartCategoricalColors in the same order as PALETTE["series"] in ui/theme.py.

[theme]
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap, system-ui, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap, Georgia, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2rem", "1.35rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
baseFontSize = 15
baseRadius = "10px"
showSidebarBorder = true
showWidgetBorder = true

[theme.light]
primaryColor = "#2E6B4F"
backgroundColor = "#F6F3EA"
secondaryBackgroundColor = "#EEEADF"
textColor = "#1F2420"
borderColor = "#E4DFD2"
dataframeBorderColor = "#E4DFD2"
dataframeHeaderBackgroundColor = "#F1EDE2"
linkColor = "#2E6B4F"
chartCategoricalColors = ["#2E6B4F", "#A7A296", "#B7791F"]
chartSequentialColors = ["#E3EFE7", "#C9E0D1", "#ADD0BA", "#90BFA2", "#73AD8A", "#579B73", "#3F875F", "#2E6B4F", "#245840", "#1A4431"]

[theme.light.sidebar]
backgroundColor = "#F1EDE2"
secondaryBackgroundColor = "#E8E3D6"

[theme.dark]
primaryColor = "#7CC29E"
backgroundColor = "#161A17"
secondaryBackgroundColor = "#1F2420"
textColor = "#ECE8DD"
borderColor = "#323A34"
dataframeBorderColor = "#323A34"
dataframeHeaderBackgroundColor = "#1F2420"
linkColor = "#7CC29E"
chartCategoricalColors = ["#7CC29E", "#6E6A61", "#D99A3A"]
chartSequentialColors = ["#1A3326", "#1F4130", "#25503A", "#2C5F45", "#356F51", "#3F805E", "#4E926C", "#62A57D", "#7CC29E", "#A6D9BC"]

[theme.dark.sidebar]
backgroundColor = "#1B1F1C"
secondaryBackgroundColor = "#252B26"

[client]
toolbarMode = "minimal"
showErrorDetails = false  # no tracebacks in the browser; they still go to the server log

[server]
headless = true
maxUploadSize = 2  # MB; a year of purchases as CSV is well under this
